<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FCB Gaming Center | PS4 9.00</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}
    body{background:#070707;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:-32px;background:#070707 url('fcb-logo.png') center/cover no-repeat;filter:blur(18px);transform:scale(1.08);opacity:.62}
    body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,rgba(255,190,0,.22),transparent 42%),linear-gradient(135deg,rgba(0,0,0,.9),rgba(18,12,0,.76));pointer-events:none}
    @font-face{font-family:logging;src:url('fonts/LiberationMono-Regular.ttf')}
    .shell{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:26px}
    .card{width:92%;max-width:760px;padding:28px 34px 30px;text-align:center;background:rgba(8,8,8,.72);border:1px solid rgba(255,194,34,.55);border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.62),0 0 28px rgba(255,185,0,.16)}
    .brand{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:20px}
    .brand img{width:116px;height:116px;object-fit:cover;border-radius:24px;border:2px solid #f5bc20;box-shadow:0 0 22px rgba(255,190,0,.34)}
    .brand-copy{text-align:left}
    h1{font-size:34px;letter-spacing:.8px;color:#ffd45f;text-shadow:0 2px 14px rgba(255,174,0,.22)}
    .version{font-size:19px;margin-top:7px;color:#fff}
    #console{height:270px;padding:19px;border-radius:13px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);font:17px/1.42 logging,monospace;text-align:left;white-space:pre-wrap;overflow-y:auto;color:#f8f8f8}
    .footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:17px;color:#d7d7d7;font-size:16px}
    .phone{direction:ltr;color:#ffd45f;font-weight:bold;letter-spacing:1px}.change{color:#ffd45f;text-decoration:none}
    @media(max-width:640px){.brand img{width:90px;height:90px}.brand-copy h1{font-size:26px}.card{padding:22px}.footer{font-size:14px}}
  </style>
</head>
<body>
  <script>
    if(window.applicationCache&&window.applicationCache.status===0){window.location.replace('cache.html')}
  </script>
  <main class="shell">
    <section class="card">

        <div class="brand-copy">

      <div class="footer">
        <span>Keep this page open until GoldHEN loads &middot; <a class="change" href="../?choose=1">Change firmware</a></span>
        <span class="phone">01203930288</span>
      </div>
    </section>
  </main>
  <script src="payload.js"></script>
  <script type="module" src="./alert.mjs"></script>
</body>
</html>
