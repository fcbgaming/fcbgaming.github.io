<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCB Gaming Center | PS4 Firmware 11–13</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;background:#080600;color:#fff;font:15px/1.45 Arial,sans-serif;overflow:hidden}
  body:before{content:"";position:fixed;inset:-32px;background:url('fcb-logo.png') center/cover no-repeat;filter:blur(18px);transform:scale(1.08);opacity:.58}
  body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,rgba(255,190,0,.2),transparent 42%),linear-gradient(135deg,rgba(0,0,0,.92),rgba(23,15,0,.78))}
  #shell{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:26px}
  #card{width:92%;max-width:760px;padding:28px 34px 30px;background:rgba(8,8,8,.78);border:1px solid rgba(255,194,34,.56);border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.68)}
  #brand{display:flex;align-items:center;justify-content:center;gap:19px;margin-bottom:25px}
  #brand img{width:112px;height:112px;object-fit:cover;border-radius:24px;border:2px solid #f5bc20;box-shadow:0 0 22px rgba(255,190,0,.34)}
  #brand h1{margin:0;color:#ffd45f;font-size:34px;letter-spacing:.5px}#brand p{margin:7px 0 0;font-size:18px;color:#fff}
  #status{padding:20px;border-radius:13px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);min-height:150px}
  #state{font-size:25px;font-weight:700;margin:0 0 12px;color:#ffd45f}
  #det{font-size:16px;color:#d9d9d9;margin:0 0 8px}#det b{color:#fff}#cache{font-size:15px;color:#aaa;min-height:20px}.cacheok,.ok{color:#7fd0a0!important}.bad{color:#ff8d81!important}.warn{color:#ffd45f!important}
  #foot{display:flex;justify-content:space-between;gap:15px;margin-top:17px;color:#ccc;font-size:15px}#foot a{color:#ffd45f;text-decoration:none}.phone{color:#ffd45f;font-weight:bold;direction:ltr}
</style>
</head>
<body><div id="shell"><section id="card">
  <div id="brand"><img src="fcb-logo.png" alt="FCB"><div><h1>FCB Gaming Center</h1><p>GoldHEN Host — PS4 Firmware 11.00–13.00</p></div></div>
  <div id="status"><div id="state">Detecting firmware...</div><div id="det"></div><div id="cache"></div></div>
  <div id="foot"><a href="../?choose=1">Change firmware</a><span class="phone">01203930288</span></div>
</section></div>
<script>
(function(){
 var stateEl=document.getElementById('state'),detEl=document.getElementById('det'),cacheEl=document.getElementById('cache');
 function setState(t,c){stateEl.textContent=t;stateEl.className=c||''}function setCache(t,ok){cacheEl.textContent=t;cacheEl.className=ok?'cacheok':''}
 var params=new URLSearchParams(location.search),key=null,fwnum=null,m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
 if(m){var minor=parseInt(m[2],16),ms=minor.toString(16);if(ms.length<2)ms='0'+ms;key=m[1]+'.'+ms;fwnum=parseInt(m[1],10)*100+parseInt(ms,10)}
 var bug=null,why='',forced=params.get('bug');
 if(forced==='lapse'||forced==='poops'){bug=forced;why='forced via ?bug='+forced}else if(!key){why='user-agent is not a PlayStation 4'}else if(fwnum<=1202){bug='lapse';why=key+' <= 12.02'}else if(fwnum>=1250){bug='poops';why=key+' >= 12.50'}else{why=key+' — no compatible chain'}
 detEl.innerHTML='Firmware <b>'+(key||'unknown')+'</b> &middot; Chain <b>'+(bug||'none')+'</b> &middot; '+why;
 if(!bug){setState('UNSUPPORTED FIRMWARE','bad');return}
 var target=(bug==='lapse'?'run_lapse.html':'run_poops.html')+location.search;
 function go(){setState('Loading '+bug+' chain...','warn');location.replace(target)}
 function waitForTap(msg,action){setState(msg,'warn');function fire(){window.removeEventListener('click',fire);window.removeEventListener('keydown',fire);action()}window.addEventListener('click',fire);window.addEventListener('keydown',fire)}
 var ac=window.applicationCache;
 if(!ac||!document.documentElement.hasAttribute('manifest')){go()}else if(!navigator.onLine){setCache('Offline — loaded from cache',true);go()}else if(ac.status===ac.IDLE){setCache('Offline cache ready',true);go()}else if(ac.status===ac.UPDATEREADY){try{ac.swapCache()}catch(e){}setCache('Update downloaded',true);waitForTap('UPDATE READY — press X to reload and run',function(){location.reload()})}else{
  setCache('Checking offline cache...');ac.addEventListener('downloading',function(){setCache('Installing offline cache...')},false);
  ac.addEventListener('progress',function(e){if(e&&e.total)setCache('Installing offline cache '+Math.round(e.loaded/e.total*100)+'%')},false);
  ac.addEventListener('cached',function(){setCache('Offline cache installed',true);waitForTap('CACHE READY — press X to run',go)},false);
  ac.addEventListener('updateready',function(){try{ac.swapCache()}catch(e){}setCache('Update downloaded',true);waitForTap('UPDATE READY — press X to reload and run',function(){location.reload()})},false);
  ac.addEventListener('noupdate',function(){setCache('Offline cache ready',true);go()},false);
  ac.addEventListener('error',function(){setCache('Cache unavailable');waitForTap('CACHE FAILED — press X to run anyway',go)},false);
  ac.addEventListener('obsolete',function(){setCache('Cache obsolete');waitForTap('CACHE OBSOLETE — press X to run',go)},false)
 }
})();
</script></body></html>
