<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="selector.appcache">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FCB Gaming Center | PS4 Host</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
    body{background:#080600;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:-35px;background:url('fcb-logo.png') center/cover no-repeat;filter:blur(20px);transform:scale(1.09);opacity:.58}
    body:after{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.94),rgba(32,21,0,.78))}
    main{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px}
    .panel{width:92%;max-width:850px;padding:30px;background:rgba(7,7,7,.82);border:1px solid rgba(255,194,34,.58);border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.7)}
    .brand{display:flex;direction:ltr;align-items:center;justify-content:center;gap:20px;margin-bottom:28px}
    .brand img{width:112px;height:112px;object-fit:cover;border-radius:24px;border:2px solid #f5bc20;box-shadow:0 0 24px rgba(255,190,0,.3)}
    h1{margin:0;color:#ffd45f;font-size:36px}.subtitle{margin-top:7px;color:#ddd;font-size:18px}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    button{width:100%;min-height:145px;padding:22px;border:1px solid rgba(255,195,35,.48);border-radius:18px;background:linear-gradient(145deg,rgba(39,31,12,.96),rgba(10,10,10,.98));color:#fff;cursor:pointer;text-align:center}
    button:focus,button:hover{outline:none;border-color:#ffd45f;box-shadow:0 0 25px rgba(255,190,0,.2);transform:translateY(-2px)}
    .fw{display:block;color:#ffd45f;font-size:31px;font-weight:bold;margin-bottom:10px}.desc{font-size:17px;color:#dedede}
    .hint{text-align:center;margin-top:22px;color:#aaa;font-size:15px}.phone{direction:ltr;display:inline-block;color:#ffd45f;font-weight:bold;margin-right:8px}
    @media(max-width:680px){.choices{grid-template-columns:1fr}.brand img{width:88px;height:88px}h1{font-size:28px}.panel{padding:22px}}
  </style>
</head>
<body>
  <main><section class="panel">
    <div class="brand"><img src="fcb-logo.png" alt="FCB"><div><h1>FCB Gaming Center</h1><div class="subtitle">اختر إصدار نظام جهاز PlayStation 4</div></div></div>
    <div class="choices">
      <button type="button" onclick="selectHost('505')"><span class="fw">Firmware 5.05</span><span class="desc">GoldHEN Host مخصص لإصدار 5.05</span></button>
      <button type="button" onclick="selectHost('672')"><span class="fw">Firmware 6.72</span><span class="desc">GoldHEN Host مخصص لإصدار 6.72</span></button>
      <button type="button" onclick="selectHost('900')"><span class="fw">Firmware 9.00</span><span class="desc">PSFree + Lapse المستقر لإصدار 9.00</span></button>
      <button type="button" onclick="selectHost('1300')"><span class="fw">Firmware 11–13</span><span class="desc">اختيار تلقائي لسلسلة التشغيل المتوافقة</span></button>
    </div>
    <div class="hint">سيتم حفظ اختيارك وتشغيل الهوست المناسب تلقائيًا في المرات القادمة &middot; <span class="phone">01203930288</span></div>
  </section></main>
  <script>
    (function(){
      var force=location.search.indexOf('choose=1')!==-1;
      if(force){try{localStorage.removeItem('fcbFirmwareChoice')}catch(e){}return}
      try{var saved=localStorage.getItem('fcbFirmwareChoice');if(saved==='505'||saved==='672'||saved==='900'||saved==='1300'){location.replace(saved+'/')}}catch(e){}
    })();
    function selectHost(version){try{localStorage.setItem('fcbFirmwareChoice',version)}catch(e){}location.href=version+'/'}
  </script>
</body>
</html>
